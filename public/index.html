<body>

  <script src="/js/app.js?v=20261111vcoin"></script>
  <script src="js/friends.js?v=20261106v2"></script>
  <script src="js/duel.js?v=20261105v5"></script>
  <script src="js/desktop/core.js?v=20261111vcoin"></script>
  <script src="js/desktop/screens.js?v=20261111vcoin"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=20261111perf').then(reg => {
          reg.update();
        }).catch(err => console.warn('[SW reg fail]', err));
      });
    }

    // Auto-pause SVG animations when offscreen or tab hidden (Section 5.5)
    if (typeof IntersectionObserver !== 'undefined') {
      const io = new IntersectionObserver(es => es.forEach(e => {
        const off = !e.isIntersecting;
        e.target.classList.toggle('fx-paused', off);
        try {
          if (off && typeof e.target.pauseAnimations === 'function') e.target.pauseAnimations();
          else if (!off && typeof e.target.unpauseAnimations === 'function') e.target.unpauseAnimations();
        } catch (_) {}
      }), { threshold: 0.05 });
      const watchFx = (root = document) => root.querySelectorAll('svg.fx, .skin-thumbnail-box svg').forEach(s => io.observe(s));
      document.addEventListener('visibilitychange', () =>
        document.querySelectorAll('svg.fx, .skin-thumbnail-box svg').forEach(s => {
          const hide = document.hidden;
          s.classList.toggle('fx-paused', hide);
          try {
            if (hide && typeof s.pauseAnimations === 'function') s.pauseAnimations();
            else if (!hide && typeof s.unpauseAnimations === 'function') s.unpauseAnimations();
          } catch (_) {}
        }));
      if (typeof MutationObserver !== 'undefined') {
        const mo = new MutationObserver(() => watchFx(document));
        window.addEventListener('DOMContentLoaded', () => {
          watchFx(document);
          mo.observe(document.body, { childList: true, subtree: true });
        });
      }
    }
  </script>
</body>
</html>
