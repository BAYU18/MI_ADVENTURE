<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="description" content="Petualangan Pelajar — game edukasi kuis interaktif untuk pelajar SD">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Petualangan Pelajar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/shared/gameplay.js"></script>
  <script src="/shared/grading.js"></script>
  <script src="js/monsters.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('[SW reg fail]', err));
      });
    }
  </script>
</body>
</html>
