<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1e1b4b">
  <title>Admin Guru — Petualangan Pelajar</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      overflow-y: auto !important;
      -webkit-user-select: text !important;
      user-select: text !important;
    }
    .admin-container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: var(--c-surface);
      border: 1px solid var(--c-surface-strong);
      border-radius: var(--radius);
      padding: 14px 18px;
    }
    .stat-card .val {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--c-primary);
      margin-top: 4px;
    }
    .stat-card .lbl {
      font-size: .8rem;
      color: var(--c-muted);
    }
    .table-wrap {
      background: var(--c-surface);
      border: 1px solid var(--c-surface-strong);
      border-radius: var(--radius);
      overflow-x: auto;
    }
    table.adm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
      text-align: left;
    }
    table.adm-table th {
      background: rgba(0,0,0,.35);
      padding: 12px 14px;
      color: var(--c-muted);
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    table.adm-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      vertical-align: middle;
    }
    table.adm-table tr:hover td {
      background: rgba(255,255,255,.03);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 700;
    }
    .badge.green { background: rgba(34,197,94,.2); color: #4ade80; }
    .badge.yellow { background: rgba(245,158,11,.2); color: #fbbf24; }
    .badge.red { background: rgba(239,68,68,.2); color: #f87171; }
    .badge.blue { background: rgba(56,189,248,.2); color: #38bdf8; }
    .btn.small {
      padding: 6px 12px;
      font-size: .78rem;
    }
  </style>
</head>
<body>
  <div id="admin-app" class="admin-container">
    <div style="text-align:center;padding:40px;color:var(--c-muted)">Memuat Portal Admin...</div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/admin.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('[SW reg fail]', err));
      });
    }
  </script>
</body>
</html>
