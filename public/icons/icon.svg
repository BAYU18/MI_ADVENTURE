<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="#0f172a"/>
  <circle cx="256" cy="230" r="210" fill="url(#bgGlow)"/>

  <!-- Shield Base (Tembok Pertahanan Pendidikan) -->
  <g filter="url(#dropShadow)">
    <path d="M 256 64 C 360 64 416 96 416 192 C 416 320 256 424 256 424 C 256 424 96 320 96 192 C 96 96 152 64 256 64 Z"
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- Golden Crest / Inner Border -->
  <path d="M 256 94 C 340 94 384 120 384 196 C 384 298 256 384 256 384 C 256 384 128 298 128 196 C 128 120 172 94 256 94 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Cross Sword (Pedang Ilmu) -->
  <g filter="url(#dropShadow)" transform="translate(256, 235) rotate(-45) translate(-256, -235)">
    <!-- Blade -->
    <path d="M 250 80 L 256 60 L 262 80 L 260 270 L 252 270 Z" fill="url(#bladeGrad)"/>
    <path d="M 256 60 L 262 80 L 260 270 L 256 270 Z" fill="#94a3b8" opacity="0.4"/>
    <!-- Guard -->
    <rect x="226" y="270" width="60" height="12" rx="4" fill="url(#goldGrad)"/>
    <circle cx="226" cy="276" r="6" fill="#fde047"/>
    <circle cx="286" cy="276" r="6" fill="#fde047"/>
    <!-- Grip -->
    <rect x="251" y="282" width="10" height="28" rx="2" fill="#78350f"/>
    <!-- Pommel -->
    <circle cx="256" cy="318" r="10" fill="url(#goldGrad)"/>
    <circle cx="256" cy="318" r="4" fill="#fbbf24"/>
  </g>

  <!-- Crossed Wand / Pen (Pena Pelajar) -->
  <g filter="url(#dropShadow)" transform="translate(256, 235) rotate(45) translate(-256, -235)">
    <!-- Pen Shaft -->
    <path d="M 252 85 L 256 65 L 260 85 L 258 275 L 254 275 Z" fill="#38bdf8"/>
    <!-- Nib & details -->
    <polygon points="256,58 250,78 262,78" fill="url(#goldGrad)"/>
    <rect x="248" y="275" width="16" height="34" rx="4" fill="url(#goldGrad)"/>
    <circle cx="256" cy="318" r="9" fill="url(#goldGrad)"/>
  </g>

  <!-- Center Star of Knowledge (Bintang Prestasi) -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="235" r="38" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- 5-Point Star -->
    <polygon points="256,206 264,226 286,226 268,239 275,259 256,246 237,259 244,239 226,226 248,226"
             fill="url(#goldGrad)"/>
  </g>

  <!-- Open Book Emblem below star -->
  <g transform="translate(256, 320) scale(0.9) translate(-256, -320)" filter="url(#dropShadow)">
    <!-- Left page -->
    <path d="M 256 310 C 220 300 180 305 160 315 L 160 345 C 180 335 220 330 256 340 Z" fill="#f8fafc"/>
    <!-- Right page -->
    <path d="M 256 310 C 292 300 332 305 352 315 L 352 345 C 332 335 292 330 256 340 Z" fill="#e2e8f0"/>
    <!-- Spine bookmark -->
    <polygon points="254,306 258,306 257,346 255,346" fill="#f59e0b"/>
  </g>

  <!-- Little sparkle particles -->
  <circle cx="160" cy="140" r="5" fill="#fde047" opacity="0.8"/>
  <polygon points="360,135 363,143 371,143 365,148 367,156 360,151 353,156 355,148 349,143 357,143" fill="#fde047" opacity="0.85"/>
  <circle cx="370" cy="290" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="140" cy="270" r="4" fill="#4ade80" opacity="0.7"/>
</svg>
